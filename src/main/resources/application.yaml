spring:
  application:
    name: aiProjectBuilder
  datasource:
    url: jdbc:postgresql://localhost:9010/pgvector-test?options=-c%20TimeZone=Asia/Kolkata
    username: user
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

